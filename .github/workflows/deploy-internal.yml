# Adhering to SOLID & Design Patterns
name: Deploy Internal Frontend (SPA Static)

on:
  push:
    branches:
      - main
    paths:
      - 'fe-react-thanhxuan-internal/**'
      - '.github/workflows/deploy-internal.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Expose pnpm store path
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        working-directory: fe-react-thanhxuan-internal
        run: pnpm install --frozen-lockfile

      - name: Build Internal Frontend SPA
        working-directory: fe-react-thanhxuan-internal
        env:
          VITE_API_URL: ${{ secrets.INTERNAL_VITE_API_URL || 'https://api.thanhxuanlaundry.com' }}
        run: pnpm run build

      - name: Deploy Static Dist via SSH/SCP to VPS
        if: github.ref == 'refs/heads/main' && env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'fe-react-thanhxuan-internal/dist/*'
          target: '/var/www/noibo/dist'
          strip_components: 2
          overwrite: true

