# Adhering to SOLID & Design Patterns
name: Deploy Internal Frontend (SPA Static)

on:
  push:
    branches: [master, main, dev]
    paths:
      - 'fe-react-thanhxuan-internal/**'
      - '.github/workflows/deploy-internal.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure fe-react-thanhxuan-internal sources
        shell: bash
        run: |
          if [ ! -f "fe-react-thanhxuan-internal/package.json" ]; then
            echo "Directory fe-react-thanhxuan-internal not present in root tree. Fetching from sub-repo..."
            git clone --depth 1 https://github.com/${{ github.repository_owner }}/fe-react-thanhxuan-internal.git fe-react-thanhxuan-internal
          fi

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Expose pnpm store path
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('fe-react-thanhxuan-internal/pnpm-lock.yaml', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        working-directory: fe-react-thanhxuan-internal
        run: pnpm install --frozen-lockfile

      - name: Build Internal Frontend SPA
        working-directory: fe-react-thanhxuan-internal
        env:
          VITE_API_URL: ${{ secrets.INTERNAL_VITE_API_URL || secrets.NEXT_PUBLIC_API_URL || 'https://api.thanhxuanlaundry.com' }}
        run: pnpm run build

      - name: Deploy Static Dist via SSH/SCP to VPS
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.HOST || secrets.VPS_HOST }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST || secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME || secrets.VPS_USER || 'root' }}
          password: ${{ secrets.PASSWORD || secrets.VPS_PASSWORD }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.PORT || secrets.VPS_PORT || 22 }}
          source: 'fe-react-thanhxuan-internal/dist/*'
          target: '/var/www/noibo/dist'
          strip_components: 2
          overwrite: true
