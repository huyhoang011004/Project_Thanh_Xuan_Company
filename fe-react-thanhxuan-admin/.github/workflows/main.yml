# Adhering to SOLID & Design Patterns
name: Deploy Admin Frontend (SPA Static)

on:
  push:
    branches: [master, main, build]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin Frontend SPA
        env:
          VITE_API_URL: ${{ secrets.ADMIN_VITE_API_URL || '' }}
        run: pnpm run build

      - name: Deploy Static Dist via SSH/SCP to VPS
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST || secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME || secrets.VPS_USER || 'root' }}
          password: ${{ secrets.PASSWORD || secrets.VPS_PASSWORD }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.PORT || secrets.VPS_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/quantri/dist"
          strip_components: 1
          overwrite: true

      - name: Sync Git Repository & Post-deploy on VPS
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST || secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME || secrets.VPS_USER || 'root' }}
          password: ${{ secrets.PASSWORD || secrets.VPS_PASSWORD }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.PORT || secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Cập nhật mã nguồn git trên VPS..."
            cd /root/services/thanhxuan/fe-react-thanhxuan-admin
            git fetch origin main || git fetch origin master
            git reset --hard origin/main || git reset --hard origin/master

            echo "🔧 Cập nhật quyền thư mục /var/www/quantri/dist..."
            chown -R www-data:www-data /var/www/quantri/dist
            chmod -R 755 /var/www/quantri/dist

            echo "🔄 Reload Nginx..."
            nginx -t && systemctl reload nginx
            echo "✅ Cập nhật Admin Frontend hoàn tất thành công!"
