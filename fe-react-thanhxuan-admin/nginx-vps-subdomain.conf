# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR MULTI-TENANT ADMIN PORTAL
# Maps both quantri.thanhxuanlaundry.com & quantri.chuyennhatietkiem.vn to Port 3003
# ==============================================================================

# 1. Quản Trị Giặt Là Thanh Xuân: quantri.thanhxuanlaundry.com
server {
    server_name quantri.thanhxuanlaundry.com;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy API calls directly to Backend NestJS if desired, or let SPA handle it
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Quản Trị Chuyển Nhà Tiết Kiệm: quantri.chuyennhatietkiem.vn
server {
    server_name quantri.chuyennhatietkiem.vn;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
